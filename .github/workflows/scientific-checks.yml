name: Scientific checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  finite-science:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Recompute bounded results and retain failure output
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/p047-science"
          ulimit -t 600
          ulimit -v 3670016
          timeout --signal=TERM --kill-after=10s 40s \
            python -B tests/snapshot_regression.py \
            2>&1 | tee "$RUNNER_TEMP/p047-science/snapshot-regression.log"
          timeout --signal=TERM --kill-after=10s 600s \
            python -B reproduce.py --output "$RUNNER_TEMP/p047-science" \
            2>&1 | tee "$RUNNER_TEMP/p047-science/run.log"
      - name: Upload raw attempts even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p047-scientific-output
          path: ${{ runner.temp }}/p047-science/
          if-no-files-found: warn
          retention-days: 14
